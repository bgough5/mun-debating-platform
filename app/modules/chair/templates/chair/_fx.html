{# What the live-room effects watch (D-089, app/static/js/effects.js). A change seen while the page is open plays once. #}
<span hidden data-fx="session:{{ s.id }}" data-fx-committee="{{ s.committee }}" data-fx-stage="{{ sim.stage.code }}"
  data-fx-stage-name="{{ sim.stage.name }}" data-fx-stage-line="{{ fx.stage_line[:160] }}"
  data-fx-gavel="{{ fx.gavel }}" data-fx-gavel-n="{{ fx.gavel_n }}"
  data-fx-division="{{ division.id if division else 'none' }}" data-fx-division-title="{{ division.title if division else '' }}"
  data-fx-result="{{ fx.result_id or 'none' }}"
  data-fx-news="{{ fx.news.id if fx.news else 'none' }}" data-fx-news-headline="{{ fx.news.headline if fx.news else '' }}"
  data-fx-news-body="{{ fx.news.body if fx.news else '' }}" data-fx-news-label="{{ fx.news.label if fx.news else '' }}"
  data-fx-placards="{{ placards|length }}"
  data-fx-speaker="{{ current.id if current else 'none' }}" data-fx-speaker-name="{{ current.by if current else '' }}"
  data-fx-speaker-line="{{ ('Speaking ' ~ current.side ~ ' the amendment') if current and current.side else '' }}"
  data-fx-adopted="{{ fx.adopted.seq if fx.adopted else 'none' }}"></span>
