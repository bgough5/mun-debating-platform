{% extends "base.html" %}
{% from "_macros.html" import hidden_csrf %}
{% block content %}
<h1>Staff sign in</h1>
<form method="post" action="/login" class="stack">{{ hidden_csrf(csrf) }}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="who">Who are you?</label>
    <select id="who" name="who"><option value="coordinator">Coordinator</option>{% for s in staff %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
  <div class="field"><label for="pp">Passphrase</label><input id="pp" type="password" name="passphrase" autocomplete="current-password" required></div>
  <button type="submit">Sign in</button>
</form>
<p class="muted">Students don't sign in here: <a href="/join">join with your class code</a>.</p>
{% endblock %}
