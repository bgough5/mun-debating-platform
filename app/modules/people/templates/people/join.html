{% extends "base.html" %}
{% from "_macros.html" import hidden_csrf %}
{% block content %}
<h1>{{ icon("join") }} Join your class</h1>
{% if code %}<p class="ok-box">{{ icon("ok") }} Your class code is filled in from the QR code. Press Next.</p>{% endif %}
<form method="post" action="/join" class="stack">{{ hidden_csrf(csrf) }}
  <div class="field"><label for="code">Class code <span class="hint">On the board. Letters and numbers.</span></label>
    <input id="code" type="text" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required maxlength="12" value="{{ code or '' }}" style="font-size:1.6rem;letter-spacing:.2em;max-width:12rem"></div>
  <button type="submit" class="big">Next</button>
</form>
{% endblock %}
