{# The world map in the board-game look (D-090). Needs `wmap` from app.modules.mun.worldmap.board and `wm_label`. #}
<svg class="worldmap" viewBox="0 0 {{ wmap.width }} {{ wmap.height }}" role="img" aria-label="{{ wm_label }}" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="wm-raise" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.1" flood-opacity=".45"/></filter>
    <filter id="wm-token" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2.2" stdDeviation="1.4" flood-opacity=".5"/></filter>
    <radialGradient id="wm-sea-glow" cx="50%" cy="45%" r="70%"><stop offset="0%" class="wm-sea-lt"/><stop offset="100%" class="wm-sea-stop"/></radialGradient>
  </defs>
  <rect class="wm-sea" x="0" y="0" width="{{ wmap.width }}" height="{{ wmap.height }}" fill="url(#wm-sea-glow)"/>
  {% for lat in [60, 30, 0, -30] %}<line class="wm-grid" x1="0" x2="{{ wmap.width }}" y1="{{ ((84 - lat) / 142 * wmap.height)|round(1) }}" y2="{{ ((84 - lat) / 142 * wmap.height)|round(1) }}"/>{% endfor %}
  <g filter="url(#wm-raise)">
    {% for c in wmap.land %}<path class="{{ c.cls }}" d="{{ c.d }}"><title>{{ c.name }}</title></path>{% endfor %}
    {% for c in wmap.dots %}<circle class="{{ c.cls }}" cx="{{ c.x }}" cy="{{ c.y }}" r="2.6"><title>{{ c.name }}</title></circle>{% endfor %}
  </g>
  {% for t in wmap.tokens if t.leader %}<line class="wm-leader" x1="{{ t.hx }}" y1="{{ t.hy }}" x2="{{ t.x }}" y2="{{ t.y }}"/><circle class="wm-pin" cx="{{ t.hx }}" cy="{{ t.hy }}" r="2.2"/>{% endfor %}
  {% for t in wmap.tokens %}
  <g class="wm-token {{ t.cls }}" transform="translate({{ (t.x - wmap.token_w / 2)|round(1) }} {{ (t.y - wmap.token_h / 2)|round(1) }})" filter="url(#wm-token)" style="--i: {{ loop.index0 }}">
    <title>{{ t.name }}{% if t.line %}: {{ t.line }}{% endif %}{% if t.p5 %} (permanent member){% endif %}</title>
    <g class="wm-token-in">
    <rect class="wm-token-face" width="{{ wmap.token_w }}" height="{{ wmap.token_h }}" rx="4"/>
    <rect class="wm-token-band" width="{{ wmap.token_w }}" height="4" rx="2"/>
    <text class="wm-token-code" x="{{ wmap.token_w / 2 }}" y="{{ 13.5 if t.line else 17 }}" text-anchor="middle">{{ t.iso3 }}{% if t.p5 %} ★{% endif %}</text>
    {% if t.line %}<text class="wm-token-line" x="{{ wmap.token_w / 2 }}" y="22.5" text-anchor="middle">{{ t.line }}</text>{% endif %}
    </g>
  </g>
  {% endfor %}
  <g class="wm-compass" transform="translate(48 {{ wmap.height - 52 }})" aria-hidden="true">
    <circle r="26" class="wm-compass-ring"/><path class="wm-compass-star" d="M0,-24 L5,-5 L24,0 L5,5 L0,24 L-5,5 L-24,0 L-5,-5 Z"/>
    <path class="wm-compass-north" d="M0,-24 L5,-5 L0,0 L-5,-5 Z"/><text class="wm-compass-n" y="-29" text-anchor="middle">N</text>
  </g>
</svg>
<p class="wm-credit small">Map: Natural Earth (public domain). Borders are simplified for the board and are not a statement on any dispute.</p>
